# Set programs that you use
$terminal = kitty
$fileManager = nautilus
# $menu = hyprlauncher
$menu = rofi -show drun
$webBrowser = firefox
$editor = visual-studio-code-electron

env = XCURSOR_THEME,capitaine-cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,capitaine-cursors
