env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = ELECTRON_ENABLE_HW_ACCELERATION,0
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = ELECTRON_ENABLE_FORCE_SOFTWARE_GL,0
