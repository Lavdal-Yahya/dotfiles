source = ~/.config/hypr/env.conf

# ─── Variables ─────────────────────────────────────────────────────────────────────
# https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER
$terminal = kitty
$rofiDir = ~/.config/rofi/scripts
$scrDir = ~/.config/hypr/scripts

# ─── Launchers & applications ──────────────────────────────────────────────────────
bindd = $mainMod, K, Show keybindings, exec, $rofiDir/keyhints
bindd = $mainMod, Return, Terminal, exec, $terminal
bindd = $mainMod, E, File manager, exec, $fileManager
bindd = $mainMod, W, Browser, exec, $webBrowser
bindd = $mainMod, C, Editor, exec, $editor
bindd = $mainMod, X, Cursor IDE, exec, cursor
bindd = SUPER, D, Lazydocker, exec, $terminal -e lazydocker
bindd = SUPER, P, Color picker, exec, $rofiDir/hyprPicker

# Rofi menus
bindd = SUPER, SPACE, App launcher, exec, pkill rofi || rofi -show drun
bindd = ALT, SPACE, Search, exec, $rofiDir/rofisearch
bindd = SUPER, V, Clipboard history, exec, $rofiDir/clipboard
bindd = SUPER, M, Rofibeats, exec, $rofiDir/rofibeats
bindd = SUPER, period, Emoji picker, exec, $rofiDir/emoji
bindd = SUPER, B, Bluetooth menu, exec, $rofiDir/bluetooth-menu
bindd = SUPER SHIFT, W, Wifi menu, exec, $rofiDir/wifi-menu
bindd = SUPER CTRL, B, Power profiles, exec, $rofiDir/power-profiles

# ─── Window management ─────────────────────────────────────────────────────────────
bindd = $mainMod, Q, Close window, killactive,
bindd = $mainMod, Tab, Toggle floating, togglefloating,
bindd = $mainMod, backslash, Toggle pseudo, pseudo,
bindd = $mainMod, J, Toggle split layout, layoutmsg, togglesplit
bindd = $mainMod, F, Fullscreen, fullscreen,
bindd = $mainMod, N, Toggle notifications, exec, swaync-client -t

# Focus (arrow keys + Alt+Tab)
bindd = $mainMod, Left, Focus left, movefocus, l
bindd = $mainMod, Right, Focus right, movefocus, r
bindd = $mainMod, Up, Focus up, movefocus, u
bindd = $mainMod, Down, Focus down, movefocus, d
bindd = ALT, Tab, Cycle next window, cyclenext,

# Resize (Shift + arrows)
bindd = $mainMod SHIFT, Right, Resize right, resizeactive, 30 0
bindd = $mainMod SHIFT, Left, Resize left, resizeactive, -30 0
bindd = $mainMod SHIFT, Up, Resize up, resizeactive, 0 -30
bindd = $mainMod SHIFT, Down, Resize down, resizeactive, 0 30

# Swap window position (Super+Alt + arrows)
bindd = SUPER ALT, Left, Swap window left, swapwindow, l
bindd = SUPER ALT, Right, Swap window right, swapwindow, r
bindd = SUPER ALT, Up, Swap window up, swapwindow, u
bindd = SUPER ALT, Down, Swap window down, swapwindow, d

# Move/resize with mouse (Super + drag LMB/RMB)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ─── Workspaces ────────────────────────────────────────────────────────────────────
# Switch workspace (Super + 0–9)
bindd = $mainMod, 1, Workspace 1, workspace, 1
bindd = $mainMod, 2, Workspace 2, workspace, 2
bindd = $mainMod, 3, Workspace 3, workspace, 3
bindd = $mainMod, 4, Workspace 4, workspace, 4
bindd = $mainMod, 5, Workspace 5, workspace, 5
bindd = $mainMod, 6, Workspace 6, workspace, 6
bindd = $mainMod, 7, Workspace 7, workspace, 7
bindd = $mainMod, 8, Workspace 8, workspace, 8
bindd = $mainMod, 9, Workspace 9, workspace, 9
bindd = $mainMod, 0, Workspace 10, workspace, 10

# Relative workspace (Super+Ctrl + Left/Right)
bindd = $mainMod CONTROL, Right, Next workspace, workspace, r+1
bindd = $mainMod CONTROL, Left, Previous workspace, workspace, r-1

# Move window to workspace (Super+Shift + 0–9)
bindd = $mainMod SHIFT, 1, Move to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Move to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Move to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Move to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Move to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Move to workspace 10, movetoworkspace, 10

# Scroll workspaces (Super + scroll)
bindd = $mainMod, mouse_down, Next workspace, workspace, e+1
bindd = $mainMod, mouse_up, Previous workspace, workspace, e-1

# Scratchpad
bindd = $mainMod, Z, Toggle scratchpad, togglespecialworkspace, magic
bindd = $mainMod SHIFT, Z, Move to scratchpad, movetoworkspace, special:magic

# ─── Screenshots ───────────────────────────────────────────────────────────────────
bindd = $mainMod, S, Screenshot window, exec, hyprshot -m window
bindd = $mainMod SHIFT, S, Screenshot region, exec, hyprshot -m region

# ─── Media & hardware ──────────────────────────────────────────────────────────────
# Playback
bindd = , XF86AudioPlay, Play/Pause, exec, swayosd-client --playerctl play-pause
bindd = , XF86AudioNext, Next track, exec, swayosd-client --playerctl next
bindd = , XF86AudioPrev, Previous track, exec, swayosd-client --playerctl previous

# Volume
bindd = , XF86AudioRaiseVolume, Volume up, exec, swayosd-client --output-volume raise
bindd = , XF86AudioLowerVolume, Volume down, exec, swayosd-client --output-volume lower
bindd = , XF86AudioMute, Mute output, exec, swayosd-client --output-volume mute-toggle
bindd = , XF86AudioMicMute, Mute mic, exec, swayosd-client --input-volume mute

# Brightness
bindd = , XF86MonBrightnessUp, Brightness up, exec, swayosd-client --brightness raise
bindd = , XF86MonBrightnessDown, Brightness down, exec, swayosd-client --brightness lower

# ─── Power & session ───────────────────────────────────────────────────────────────
bindd = SUPER, L, Lock screen, exec, hyprlock
bindd = SUPER SHIFT, L, Toggle idle, exec, $rofiDir/toggle-idle
bindd = $mainMod, Escape, Power menu, exec, ~/.config/rofi/scripts/powermenu
bindd = $mainMod, Delete, Exit Hyprland, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bindld = , XF86PowerOff, Power menu, exec, $rofiDir/powermenu

# ─── Themes & appearance ───────────────────────────────────────────────────────────
bindd = SUPER SHIFT, SPACE, Theme picker, exec, $rofiDir/themePicker
bindd = SUPER ALT, SPACE, Apply Matugen theme, exec, $rofiDir/selectWall
bindd = SUPER CTRL, SPACE, Wallpaper picker, exec, $rofiDir/wallPicker
bindd = SUPER CTRL, up, Cycle wallpaper, exec, $rofiDir/cycle-wallpaper
